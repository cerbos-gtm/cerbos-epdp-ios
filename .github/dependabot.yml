version: 2
updates:
  - package-ecosystem: npm
    directory: /CerbosBridge
    schedule:
      interval: weekly
    # The Cerbos SDK packages change the committed assets; the "Update embedded assets" workflow bumps them.
    ignore:
      - dependency-name: "@cerbos/*"
      - dependency-name: "@bufbuild/*"
    groups:
      tooling:
        patterns: ["esbuild", "typescript"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
