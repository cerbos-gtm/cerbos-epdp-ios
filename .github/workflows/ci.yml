name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public Cerbos Hub embedded PDP rule used by the integration tests. Override with a repository
  # variable to point the tests at a rule owned by this repository's maintainers.
  CERBOS_RULE_ID: ${{ vars.CERBOS_RULE_ID || 'AVGB9RP6HFBL' }}

jobs:
  bridge:
    name: Bridge (TypeScript, esbuild, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CerbosBridge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: CerbosBridge/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Committed assets match the build
        run: |
          git diff --exit-code -- \
            ../CerbosEmbeddedPDP/Sources/CerbosEmbeddedPDP/Resources/web/bridge.js \
            ../CerbosEmbeddedPDP/Sources/CerbosEmbeddedPDP/Resources/web/server.wasm \
            ../CerbosEmbeddedPDP/Sources/CerbosEmbeddedPDP/Resources/web/index.html \
            ../CerbosEmbeddedPDP/Sources/CerbosEmbeddedPDP/Resources/web/manifest.json
      - name: Smoke test against the real engine and Cerbos Hub
        run: npm test

  package-linux:
    name: Swift package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.4
    defaults:
      run:
        working-directory: CerbosEmbeddedPDP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift format lint --strict --recursive Sources Tests ../epdpdemo ../epdpdemoTests ../epdpdemoUITests
      - run: swift build -Xswiftc -warnings-as-errors
      - run: swift test -Xswiftc -warnings-as-errors

  apple:
    name: Swift package and app (Xcode 26)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      # Thread Sanitizer covers the main-queue invariants in the web view host.
      - name: Package tests (macOS, Thread Sanitizer)
        run: swift test --package-path CerbosEmbeddedPDP --sanitize=thread -Xswiftc -warnings-as-errors
      - name: Build and test the app on the iOS simulator
        env:
          # xcodebuild only forwards TEST_RUNNER_-prefixed variables to the test host.
          TEST_RUNNER_CERBOS_RULE_ID: ${{ env.CERBOS_RULE_ID }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][-1].udid')
          echo "Simulator: $DEVICE"
          xcodebuild test \
            -project epdpdemo.xcodeproj \
            -scheme epdpdemo \
            -destination "id=$DEVICE" \
            -only-testing:epdpdemoTests \
            -only-testing:epdpdemoUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore
      - name: Crash reports and simulator log (on failure)
        if: failure()
        run: |
          echo "::group::Crash reports"
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/epdpdemo* 2>/dev/null | head -2); do
            echo "=== $report"; head -c 20000 "$report"; echo
          done
          echo "::endgroup::"
          echo "::group::Simulator log (epdpdemo, last 5 minutes)"
          xcrun simctl spawn booted log show --last 5m --style compact --predicate 'process == "epdpdemo" OR eventMessage CONTAINS "epdpdemo"' 2>/dev/null | tail -200 || true
          echo "::endgroup::"
